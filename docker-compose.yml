services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: research
      POSTGRES_USER: research
      POSTGRES_PASSWORD: research
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U research -d research"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://research:research@db:5432/research
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: llama3:latest
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - research_artifacts:/app/artifacts
      - ./app:/app/app
      - ./experiments:/app/experiments

  experiment-sandbox:
    build:
      context: .
      dockerfile: docker/experiment/Dockerfile
    image: ai-research-experiment:dev
    profiles: ["build-only"]

volumes:
  postgres_data:
  research_artifacts:
    name: research_artifacts
